# Woofalytics Configuration
# -------------------------
# This file is managed by the Woofalytics settings UI.
# Environment variables take precedence over this file.
# Environment variables use the prefix WOOFALYTICS__ with __ as delimiter.
# Example: WOOFALYTICS__MODEL__CLAP_THRESHOLD=0.7

audio:
  # ReSpeaker USB 4 Mic Array, read directly (not via PipeWire, which exposes only 3ch).
  # Device gives 6ch @ 16 kHz: 0=processed, 1-4=raw mics, 5=playback. Keep the raw mics.
  device_name: ReSpeaker
  sample_rate: 16000
  channels: 4
  device_channels: 6
  channel_indices: [1, 2, 3, 4]
  chunk_size: 160  # 10 ms chunks; the detector assumes 100 chunks = 1 s
  volume_percent: 75
model:
  use_clap: true
  clap_threshold: 0.7
  clap_bird_veto_threshold: 0.1
  vad_threshold_db: -40.0
  path: ./models/traced_model.pt
  target_sample_rate: 16000
  threshold: 0.88
  vad_enabled: true
  yamnet_enabled: true
  yamnet_threshold: 0.05
  clap_min_harmonic_ratio: 0.0
doa:
  enabled: true
  array_type: uca
  element_spacing: 0.1
  radius: 0.093
  num_elements: 4
  angle_min: 0
  angle_max: 359
  method: bartlett
evidence:
  directory: ./evidence
  past_context_seconds: 15
  future_context_seconds: 15
  max_clip_seconds: 300
webhook:
  enabled: false
  ifttt_event: woof
  ifttt_key: ''
server:
  # Default: localhost only. Set to 0.0.0.0 to allow network access.
  host: 127.0.0.1
  port: 8000
log_level: INFO
log_format: console
